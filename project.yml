name: MorningCheck
options:
  deploymentTarget:
    iOS: '18.0'
    watchOS: '11.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '6'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MorningCheckCore:
    path: .
targets:
  MorningCheck:
    type: application
    platform: iOS
    sources: [Phone, Shared]
    dependencies:
      - package: MorningCheckCore
      - target: MorningCheckWatch
        embed: true
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.bacta.morningcheck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_ENTITLEMENTS: Config/Phone.entitlements
    entitlements:
      path: Config/Phone.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: Config/Phone-Info.plist
      properties:
        CFBundleDisplayName: DayBreak
        CFBundleName: DayBreak
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSHealthShareUsageDescription: DayBreak reads estimated sleep intervals to nudge you when the Watch's overnight data arrives. It does not write to Health or send this data to a server.
  MorningCheckWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    dependencies:
      - package: MorningCheckCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.bacta.morningcheck.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleDisplayName: DayBreak
        CFBundleName: DayBreak
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: local.bacta.morningcheck
        WKRunsIndependentlyOfCompanionApp: false
  MorningCheckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: MorningCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.bacta.morningcheck.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MorningCheck:
    build:
      targets:
        MorningCheck: all
    test:
      targets:
        - MorningCheckUITests
  MorningCheckWatch:
    build:
      targets:
        MorningCheckWatch: all
